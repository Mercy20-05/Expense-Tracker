<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <p>Manage, categorize, and track your daily spending</p>
    </header>

    <!-- Summary Cards -->
    <section class="summary-grid">
      <div class="summary-card total-card">
        <h3>Total Spending</h3>
        <p class="summary-amount" id="totalAmount">$0.00</p>
      </div>
      <div class="summary-card count-card">
        <h3>Transactions</h3>
        <p class="summary-amount" id="totalCount">0</p>
      </div>
      <div class="summary-card top-category-card">
        <h3>Top Category</h3>
        <p class="summary-text" id="topCategory">-</p>
      </div>
    </section>

    <!-- Main Content Layout -->
    <main class="main-layout">
      <!-- Expense Entry / Edit Form -->
      <section class="form-section card">
        <h2 id="formTitle">Add New Expense</h2>
        <form id="expenseForm">
          <input type="hidden" id="expenseId" />

          <div class="form-group">
            <label for="expenseTitle">Expense Description</label>
            <input 
              type="text" 
              id="expenseTitle" 
              placeholder="e.g., Grocery shopping" 
              required 
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="expenseAmount">Amount ($)</label>
              <input 
                type="number" 
                id="expenseAmount" 
                placeholder="0.00" 
                step="0.01" 
                min="0.01" 
                required 
              />
            </div>

            <div class="form-group">
              <label for="expenseCategory">Category</label>
              <select id="expenseCategory" required>
                <option value="" disabled selected>Select category</option>
                <option value="Food & Dining">Food & Dining</option>
                <option value="Transportation">Transportation</option>
                <option value="Utilities">Utilities</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="expenseDate">Date</label>
            <input type="date" id="expenseDate" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">Save Expense</button>
            <button type="button" class="btn btn-secondary hidden" id="cancelEditBtn">Cancel</button>
          </div>
        </form>
      </section>

      <!-- Listing and Filtering Section -->
      <section class="list-section card">
        <div class="list-header">
          <h2>Expense History</h2>
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
          <div class="filter-group">
            <label for="filterCategory">Filter by Category</label>
            <select id="filterCategory">
              <option value="ALL">All Categories</option>
              <option value="Food & Dining">Food & Dining</option>
              <option value="Transportation">Transportation</option>
              <option value="Utilities">Utilities</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filterStartDate">From Date</label>
            <input type="date" id="filterStartDate" />
          </div>

          <div class="filter-group">
            <label for="filterEndDate">To Date</label>
            <input type="date" id="filterEndDate" />
          </div>

          <button type="button" class="btn btn-outline" id="clearFiltersBtn">Reset Filters</button>
        </div>

        <!-- Expense Table Container -->
        <div class="table-responsive">
          <table class="expense-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="expenseListBody">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
          <p id="emptyState" class="empty-state hidden">No expenses found matching the selected criteria.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
